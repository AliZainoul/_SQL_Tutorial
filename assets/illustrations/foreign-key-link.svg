<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Clé étrangère entre orders et customers</title><desc id="d">Les commandes 1 à 4 pointent vers le client 1, la commande 5 vers le client 2, la commande 7 vers le client 3. Le client 12 n’a aucune commande. Une commande qui désigne un client 99 inexistant est refusée.</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#303030"/></marker><marker id="op" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#303030" stroke-width="1.6"/></marker></defs><rect width="1280" height="720" fill="#F7F7F7"/><rect x="24" y="20" width="1232" height="680" rx="22" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1.3"/><rect x="24" y="20" width="8" height="100" rx="4" fill="#F91562"/><text x="56" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303030" text-anchor="start">Une clé étrangère relie deux tables</text><text x="56" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555" text-anchor="start">La valeur de orders.customer_id doit exister dans customers.customer_id.</text><line x1="56" y1="122" x2="1224" y2="122" stroke="#D9DEE3" stroke-width="1.4"/><text x="56" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#303030" text-anchor="start">customers</text><text x="700" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#303030" text-anchor="start">orders</text><rect x="56" y="180" width="450" height="40" rx="0" fill="#F7F7F7" stroke="#303030" stroke-width="1.2"/><text x="68" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">customer_id</text><text x="208" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">nom</text><rect x="700" y="180" width="450" height="40" rx="0" fill="#F7F7F7" stroke="#303030" stroke-width="1.2"/><text x="712" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">order_id</text><text x="812" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">customer_id</text><text x="942" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">order_date</text><rect x="56" y="220" width="450" height="40" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.2"/><text x="68" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="208" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">Camille Durand</text><rect x="56" y="270" width="450" height="40" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.2"/><text x="68" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">2</text><text x="208" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">Lucas Martin</text><rect x="56" y="320" width="450" height="40" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.2"/><text x="68" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">3</text><text x="208" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">Emma Bernard</text><rect x="56" y="370" width="450" height="40" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.2"/><text x="68" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">12</text><text x="208" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">Arthur Lefèbvre</text><rect x="700" y="220" width="450" height="40" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.2"/><text x="712" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="812" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="942" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">2024-01-05</text><line x1="699" y1="240" x2="508" y2="240" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/><rect x="700" y="270" width="450" height="40" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.2"/><text x="712" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">2</text><text x="812" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="942" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">2024-03-12</text><line x1="699" y1="290" x2="508" y2="240" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/><rect x="700" y="320" width="450" height="40" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.2"/><text x="712" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">3</text><text x="812" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="942" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">2024-06-20</text><line x1="699" y1="340" x2="508" y2="240" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/><rect x="700" y="370" width="450" height="40" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.2"/><text x="712" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">4</text><text x="812" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="942" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">2024-11-02</text><line x1="699" y1="390" x2="508" y2="240" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/><rect x="700" y="420" width="450" height="40" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.2"/><text x="712" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">5</text><text x="812" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">2</text><text x="942" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">2024-02-14</text><line x1="699" y1="440" x2="508" y2="290" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/><rect x="700" y="470" width="450" height="40" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.2"/><text x="712" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">7</text><text x="812" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">3</text><text x="942" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">2024-03-01</text><line x1="699" y1="490" x2="508" y2="340" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/><text x="56" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">Client 12 : aucune commande (0,N côté commande).</text><rect x="700" y="540" width="450" height="40" rx="0" fill="#FDECEC" stroke="#B42318" stroke-width="1.6" stroke-dasharray="6,4"/><text x="712" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B42318" text-anchor="start">15       99            2025-02-01</text><text x="700" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B42318" text-anchor="start">Refusée : aucun client n’a l’identifiant 99.</text><text x="700" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">C’est l’intégrité référentielle, contrôlée par le moteur.</text><text x="56" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">Sans clé étrangère, rien n’empêcherait</text><text x="56" y="564" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">une commande de désigner un client fantôme.</text><text x="56" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">Avec elle, le moteur refuse la ligne avant</text><text x="56" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">qu’elle n’entre dans la table.</text></svg>