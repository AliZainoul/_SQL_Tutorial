<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Déroulement d’une transaction avec COMMIT ou ROLLBACK</title><desc id="d">Après BEGIN, les modifications ne sont pas définitives. COMMIT les valide durablement ; ROLLBACK les annule et rétablit l’état de départ.</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#303030"/></marker><marker id="op" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#303030" stroke-width="1.6"/></marker></defs><rect width="1280" height="720" fill="#F7F7F7"/><rect x="24" y="20" width="1232" height="680" rx="22" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1.3"/><rect x="24" y="20" width="8" height="100" rx="4" fill="#F91562"/><text x="56" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303030" text-anchor="start">Transaction : COMMIT ou ROLLBACK</text><text x="56" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555" text-anchor="start">Un groupe d’instructions qui réussit en bloc ou n’a aucun effet.</text><line x1="56" y1="122" x2="1224" y2="122" stroke="#D9DEE3" stroke-width="1.4"/><rect x="56" y="200" width="220" height="80" rx="12" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="166" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#303030" text-anchor="middle">BEGIN</text><text x="166" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">début de la transaction</text><rect x="330" y="200" width="220" height="80" rx="12" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="440" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#303030" text-anchor="middle">UPDATE / DELETE…</text><text x="440" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">modifications provisoires</text><line x1="276" y1="240" x2="328" y2="240" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><line x1="550" y1="240" x2="640" y2="160" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><line x1="550" y1="240" x2="640" y2="330" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><rect x="642" y="120" width="260" height="80" rx="12" fill="#E8F5EC" stroke="#15803D" stroke-width="1.8"/><text x="772" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14532D" text-anchor="middle">COMMIT</text><text x="772" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="middle">modifications validées, durables</text><rect x="642" y="290" width="260" height="80" rx="12" fill="#FDECEC" stroke="#B42318" stroke-width="1.8"/><text x="772" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#7A1810" text-anchor="middle">ROLLBACK</text><text x="772" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="middle">modifications annulées</text><text x="940" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">État final de la table :</text><text x="940" y="174" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="start">nouvelle version</text><text x="940" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">État final de la table :</text><text x="940" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="start">version d’avant BEGIN</text><text x="56" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">Pendant la transaction, vous voyez vos modifications ; les autres connexions voient encore l’ancien état (selon le niveau d’isolation).</text><text x="56" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#555555" text-anchor="start">Cas d’usage : retirer un livre du stock ET créer la ligne de commande. Si la deuxième étape échoue, ROLLBACK annule la première.</text><text x="56" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#B42318" text-anchor="start">Attention : sur MySQL, les instructions DDL (CREATE, ALTER, DROP) valident implicitement la transaction en cours.</text></svg>