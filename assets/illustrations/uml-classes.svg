<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Diagramme de classes UML de la librairie</title><desc id="d">Un client passe zéro à plusieurs commandes. Une commande se compose d’une à plusieurs lignes de commande et est réglée par au plus un paiement. Chaque ligne concerne un livre. Un livre appartient à une catégorie.</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#303030"/></marker><marker id="op" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#303030" stroke-width="1.6"/></marker></defs><rect width="1280" height="720" fill="#F7F7F7"/><rect x="24" y="20" width="1232" height="680" rx="22" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1.3"/><rect x="24" y="20" width="8" height="100" rx="4" fill="#F91562"/><text x="56" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303030" text-anchor="start">Diagramme de classes UML de la librairie</text><text x="56" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555" text-anchor="start">Notation UML : classes, attributs et multiplicités (différent du schéma relationnel).</text><line x1="56" y1="122" x2="1224" y2="122" stroke="#D9DEE3" stroke-width="1.4"/><rect x="56" y="160" width="220" height="202" rx="4" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="166.0" y="189" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#303030" text-anchor="middle">Customer</text><line x1="56" y1="202" x2="276" y2="202" stroke="#303030" stroke-width="1.4"/><text x="68" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">firstName : String</text><text x="68" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">lastName : String</text><text x="68" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">email : String</text><text x="68" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">phone : String [0..1]</text><text x="68" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">city : String</text><text x="68" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">newsletterOptIn : Boolean</text><rect x="360" y="160" width="220" height="130" rx="4" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="470.0" y="189" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#303030" text-anchor="middle">Order</text><line x1="360" y1="202" x2="580" y2="202" stroke="#303030" stroke-width="1.4"/><text x="372" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">orderDate : Date</text><text x="372" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">status : OrderStatus</text><text x="372" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">shippedDate : Date [0..1]</text><rect x="664" y="160" width="220" height="130" rx="4" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="774.0" y="189" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#303030" text-anchor="middle">Payment</text><line x1="664" y1="202" x2="884" y2="202" stroke="#303030" stroke-width="1.4"/><text x="676" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">amount : Decimal</text><text x="676" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">paymentDate : Date</text><text x="676" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">method : PaymentMethod</text><rect x="360" y="400" width="220" height="106" rx="4" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="470.0" y="429" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#303030" text-anchor="middle">OrderItem</text><line x1="360" y1="442" x2="580" y2="442" stroke="#303030" stroke-width="1.4"/><text x="372" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">quantity : Integer</text><text x="372" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">unitPrice : Decimal</text><rect x="664" y="400" width="220" height="178" rx="4" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="774.0" y="429" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#303030" text-anchor="middle">Book</text><line x1="664" y1="442" x2="884" y2="442" stroke="#303030" stroke-width="1.4"/><text x="676" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">isbn : String</text><text x="676" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">title : String</text><text x="676" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">author : String</text><text x="676" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">unitPrice : Decimal</text><text x="676" y="562" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">stockQuantity : Integer</text><rect x="968" y="400" width="220" height="106" rx="4" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="1078.0" y="429" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#303030" text-anchor="middle">Category</text><line x1="968" y1="442" x2="1188" y2="442" stroke="#303030" stroke-width="1.4"/><text x="980" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">name : String</text><text x="980" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">description : String [0..1]</text><line x1="276" y1="230" x2="360" y2="230" stroke="#303030" stroke-width="1.8"/><text x="282" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">1</text><text x="334" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="end">0..*</text><text x="318" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">passe</text><line x1="580" y1="230" x2="664" y2="230" stroke="#303030" stroke-width="1.8"/><text x="586" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">1</text><text x="658" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="end">0..1</text><text x="622" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">réglée par</text><line x1="470" y1="306" x2="470" y2="400" stroke="#303030" stroke-width="1.8"/><polygon points="470,278 478,292 470,306 462,292" fill="#303030"/><text x="482" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">1</text><text x="482" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">1..*</text><text x="490" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">se compose de</text><line x1="580" y1="450" x2="664" y2="450" stroke="#303030" stroke-width="1.8"/><text x="586" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">0..*</text><text x="658" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="end">1</text><text x="622" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">concerne</text><line x1="884" y1="450" x2="968" y2="450" stroke="#303030" stroke-width="1.8"/><text x="890" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">0..*</text><text x="962" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="end">1</text><text x="926" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">classe</text><text x="56" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">Multiplicités : « 1 » = exactement un ; « 0..* » = zéro ou plusieurs ; « 1..* » = au moins un ; « 0..1 » = au plus un.</text><text x="56" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#555555" text-anchor="start">Le losange plein est une composition : une ligne de commande n’existe pas sans sa commande.</text><text x="56" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#555555" text-anchor="start">UML décrit des classes en camelCase ; les tables SQL utiliseront snake_case (chapitre 4).</text></svg>