ica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">PK : clé primaire, identifie chaque</text><text x="56" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">ligne de façon unique.</text><text x="56" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">FK : clé étrangère (flèche vers la clé</text><text x="56" y="574" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">primaire référencée).</text><text x="56" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">(NULL) : l’absence de valeur est</text><text x="56" y="618" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">autorisée dans cette colonne.</text><text x="56" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">UNIQUE : deux lignes ne peuvent pas</text><text x="56" y="662" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">partager la même valeur.</text></svg>