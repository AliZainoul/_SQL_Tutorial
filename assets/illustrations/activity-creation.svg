<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Diagramme d’activités de création de la base</title><desc id="d">Après installation du SGBD, on crée la base, l’utilisateur, les tables puis on insère les données. Si les compteurs sont incorrects, on corrige et on relance la création des tables.</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#303030"/></marker><marker id="op" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#303030" stroke-width="1.6"/></marker></defs><rect width="1280" height="720" fill="#F7F7F7"/><rect x="24" y="20" width="1232" height="680" rx="22" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1.3"/><rect x="24" y="20" width="8" height="100" rx="4" fill="#F91562"/><text x="56" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303030" text-anchor="start">Diagramme d’activités UML : créer et peupler la base</text><text x="56" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555" text-anchor="start">Le processus suivi dans les chapitres 3 à 5, avec son contrôle final.</text><line x1="56" y1="122" x2="1224" y2="122" stroke="#D9DEE3" stroke-width="1.4"/><circle cx="330" cy="156" r="10" fill="#303030"/><rect x="150.0" y="186" width="360" height="56" rx="14" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="330" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="middle">Installer le SGBD (ou ouvrir SQLite)</text><rect x="150.0" y="276" width="360" height="56" rx="14" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="330" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="middle">Créer la base de données</text><rect x="150.0" y="366" width="360" height="56" rx="14" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="330" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="middle">Créer l’utilisateur et ses droits</text><rect x="150.0" y="456" width="360" height="56" rx="14" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="330" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="middle">Créer les tables (parents avant enfants)</text><rect x="150.0" y="546" width="360" height="56" rx="14" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="330" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="middle">Insérer les données (même ordre)</text><line x1="330" y1="166" x2="330" y2="184" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><line x1="330" y1="242" x2="330" y2="274" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><line x1="330" y1="332" x2="330" y2="364" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><line x1="330" y1="422" x2="330" y2="454" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><line x1="330" y1="512" x2="330" y2="544" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><polyline points="510,574 900,574 900,524" fill="none" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><polygon points="900,404 1020,464 900,524 780,464" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="900" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="middle">Compteurs</text><text x="900" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="middle">corrects ?</text><line x1="1020" y1="464" x2="1096" y2="464" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><text x="1058" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F91562" text-anchor="middle">oui</text><circle cx="1120" cy="464" r="14" fill="none" stroke="#303030" stroke-width="2"/><circle cx="1120" cy="464" r="8" fill="#303030"/><rect x="760" y="246" width="280" height="56" rx="14" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="900" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="middle">Corriger le script puis</text><text x="900" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="middle">exécuter 04_reset</text><line x1="900" y1="404" x2="900" y2="304" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><text x="914" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F91562" text-anchor="start">non</text><polyline points="760,274 700,274 700,484 512,484" fill="none" stroke="#303030" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ar)"/><text x="56" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">Losange = décision. Rond plein = début. Rond cerclé = fin. Le contrôle compare les compteurs de lignes : 7, 12, 15, 14, 25 et 10.</text></svg>