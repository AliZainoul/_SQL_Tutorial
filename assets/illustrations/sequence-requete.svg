<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Diagramme de séquence d’une requête SELECT</title><desc id="d">La personne saisit une requête dans le client SQL, qui l’envoie au serveur. Le serveur l’analyse, lit les fichiers de données, puis renvoie les lignes au client qui affiche un tableau.</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#303030"/></marker><marker id="op" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#303030" stroke-width="1.6"/></marker></defs><rect width="1280" height="720" fill="#F7F7F7"/><rect x="24" y="20" width="1232" height="680" rx="22" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1.3"/><rect x="24" y="20" width="8" height="100" rx="4" fill="#F91562"/><text x="56" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303030" text-anchor="start">Diagramme de séquence UML : envoyer une requête</text><text x="56" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555" text-anchor="start">Qui parle à qui, dans quel ordre, pour afficher un résultat.</text><line x1="56" y1="122" x2="1224" y2="122" stroke="#D9DEE3" stroke-width="1.4"/><rect x="85" y="146" width="170" height="44" rx="10" fill="#F7F7F7" stroke="#303030" stroke-width="1.6"/><text x="170" y="174" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#303030" text-anchor="middle">Personne</text><line x1="170" y1="190" x2="170" y2="660" stroke="#C9CED4" stroke-width="1.8" stroke-dasharray="7,6"/><rect x="375" y="146" width="170" height="44" rx="10" fill="#F7F7F7" stroke="#303030" stroke-width="1.6"/><text x="460" y="174" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#303030" text-anchor="middle">Client SQL</text><line x1="460" y1="190" x2="460" y2="660" stroke="#C9CED4" stroke-width="1.8" stroke-dasharray="7,6"/><rect x="705" y="146" width="170" height="44" rx="10" fill="#F7F7F7" stroke="#303030" stroke-width="1.6"/><text x="790" y="174" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#303030" text-anchor="middle">Serveur SGBDR</text><line x1="790" y1="190" x2="790" y2="660" stroke="#C9CED4" stroke-width="1.8" stroke-dasharray="7,6"/><rect x="995" y="146" width="170" height="44" rx="10" fill="#F7F7F7" stroke="#303030" stroke-width="1.6"/><text x="1080" y="174" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#303030" text-anchor="middle">Fichiers de données</text><line x1="1080" y1="190" x2="1080" y2="660" stroke="#C9CED4" stroke-width="1.8" stroke-dasharray="7,6"/><rect x="453" y="228" width="14" height="362" rx="0" fill="#FFFFFF" stroke="#303030" stroke-width="1.6"/><rect x="783" y="290" width="14" height="270" rx="0" fill="#FFFFFF" stroke="#303030" stroke-width="1.6"/><rect x="1073" y="425" width="14" height="55" rx="0" fill="#FFFFFF" stroke="#303030" stroke-width="1.6"/><line x1="177" y1="240" x2="453" y2="240" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><text x="315.0" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="middle">1 : saisit  SELECT …;</text><line x1="467" y1="300" x2="783" y2="300" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><text x="625.0" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="middle">2 : envoie le texte SQL</text><polyline points="797,350 860,350 860,386 797,386" fill="none" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><text x="872" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="start">3 : analyse, optimise, planifie</text><line x1="797" y1="440" x2="1073" y2="440" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><text x="935.0" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="middle">4 : lit les pages de la table</text><line x1="1073" y1="480" x2="797" y2="480" stroke="#303030" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#ar)"/><text x="935.0" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="middle">5 : retourne les données</text><line x1="783" y1="548" x2="467" y2="548" stroke="#303030" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#ar)"/><text x="625.0" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="middle">6 : renvoie les lignes du résultat</text><line x1="453" y1="600" x2="177" y2="600" stroke="#303030" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#ar)"/><text x="315.0" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="middle">7 : affiche le tableau</text><text x="56" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">Flèche pleine : appel. Flèche pointillée : retour. Les barres blanches sont les activations (moments où chaque participant travaille).</text></svg>