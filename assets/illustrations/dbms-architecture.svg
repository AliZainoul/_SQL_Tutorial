<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Architecture simplifiée d’un SGBDR</title><desc id="d">Une personne écrit une requête dans un client SQL. Le client l’envoie au serveur. Le moteur analyse, optimise puis exécute la requête sur les fichiers de données.</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#303030"/></marker><marker id="op" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#303030" stroke-width="1.6"/></marker></defs><rect width="1280" height="720" fill="#F7F7F7"/><rect x="24" y="20" width="1232" height="680" rx="22" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1.3"/><rect x="24" y="20" width="8" height="100" rx="4" fill="#F91562"/><text x="56" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303030" text-anchor="start">Comment une requête SQL traverse un SGBDR</text><text x="56" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555" text-anchor="start">De la personne qui écrit la requête jusqu’aux données stockées.</text><line x1="56" y1="122" x2="1224" y2="122" stroke="#D9DEE3" stroke-width="1.4"/><rect x="56" y="280" width="170" height="130" rx="10" fill="#F7F7F7" stroke="#303030" stroke-width="1.6"/><text x="141.0" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#303030" text-anchor="middle">Personne</text><text x="141.0" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="middle">écrit la requête</text><rect x="290" y="280" width="200" height="130" rx="10" fill="#F7F7F7" stroke="#303030" stroke-width="1.6"/><text x="390.0" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#303030" text-anchor="middle">Client SQL</text><text x="390.0" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="middle">DBeaver, psql, mysql…</text><rect x="1030" y="280" width="194" height="130" rx="10" fill="#F7F7F7" stroke="#303030" stroke-width="1.6"/><text x="1127.0" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#303030" text-anchor="middle">Fichiers de données</text><text x="1127.0" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="middle">tables stockées sur disque</text><rect x="560" y="170" width="400" height="400" rx="10" fill="#FFFFFF" stroke="#F91562" stroke-width="2.4"/><text x="760" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#303030" text-anchor="middle">Serveur SGBDR (le « moteur »)</text><rect x="590" y="230" width="340" height="86" rx="10" fill="#F7F7F7" stroke="#303030" stroke-width="1.6"/><text x="760" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#303030" text-anchor="middle">1. Analyseur</text><text x="760" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="middle">vérifie la syntaxe et les noms</text><rect x="590" y="336" width="340" height="86" rx="10" fill="#F7F7F7" stroke="#303030" stroke-width="1.6"/><text x="760" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#303030" text-anchor="middle">2. Optimiseur</text><text x="760" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="middle">choisit la façon la plus efficace</text><rect x="590" y="442" width="340" height="86" rx="10" fill="#F7F7F7" stroke="#303030" stroke-width="1.6"/><text x="760" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#303030" text-anchor="middle">3. Exécuteur</text><text x="760" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="middle">lit et assemble les lignes</text><line x1="226" y1="345" x2="288" y2="345" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><line x1="490" y1="330" x2="558" y2="330" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><line x1="558" y1="365" x2="492" y2="365" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><line x1="960" y1="345" x2="1028" y2="345" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><text x="257" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">texte</text><text x="524" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#F91562" text-anchor="middle">SQL</text><text x="524" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">lignes</text><text x="56" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#303030" text-anchor="start">Ce qu’il faut comprendre : le client ne lit jamais les fichiers lui-même. Il envoie du texte SQL ; le moteur décide comment obtenir le résultat.</text><text x="56" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555" text-anchor="start">PostgreSQL et MySQL : le serveur est un programme séparé. SQLite : le moteur est une bibliothèque intégrée au client, la base est un simple fichier.</text></svg>