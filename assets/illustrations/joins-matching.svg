, complétée</text><text x="912" y="492" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">par NULL.</text><text x="912" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">RIGHT JOIN = LEFT JOIN en inversant les</text><text x="912" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">deux tables : ici 4 lignes aussi.</text><text x="56" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">INNER garde seulement les couples reliés ; LEFT garde en plus toute la table de gauche ; FULL garde tout des deux côtés.</text></svg>