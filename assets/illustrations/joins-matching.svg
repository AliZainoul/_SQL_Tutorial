x="56" y="504" width="200" height="28" rx="0" fill="#FDE8EF" stroke="#C9CED4" stroke-width="1.1"/><text x="64" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">Lucas</text><text x="174" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">5</text><text x="330" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">LEFT JOIN : 4 lignes</text><rect x="330" y="420" width="200" height="28" rx="0" fill="#303030" stroke="#303030" stroke-width="1.2"/><text x="338" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">first_name</text><text x="448" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">order_id</text><rect x="330" y="448" width="200" height="28" rx="0" fill="#FDE8EF" stroke="#C9CED4" stroke-width="1.1"/><text x="338" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">Camille</text><text x="448" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">1</text><rect x="330" y="476" width="200" height="28" rx="0" fill="#FDE8EF" stroke="#C9CED4" stroke-width="1.1"/><text x="338" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">Camille</text><text x="448" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">2</text><rect x="330" y="504" width="200" height="28" rx="0" fill="#FDE8EF" stroke="#C9CED4" stroke-width="1.1"/><text x="338" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">Lucas</text><text x="448" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">5</text><rect x="330" y="532" width="200" height="28" rx="0" fill="#FFF4DF" stroke="#C9CED4" stroke-width="1.1"/><text x="338" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">Jules</text><text x="448" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start" font-style="italic">NULL</text><text x="604" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">FULL JOIN : 5 lignes</text><rect x="604" y="420" width="200" height="28" rx="0" fill="#303030" stroke="#303030" stroke-width="1.2"/><text x="612" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">first_name</text><text x="722" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">order_id</text><rect x="604" y="448" width="200" height="28" rx="0" fill="#FDE8EF" stroke="#C9CED4" stroke-width="1.1"/><text x="612" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">Camille</text><text x="722" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">1</text><rect x="604" y="476" width="200" height="28" rx="0" fill="#FDE8EF" stroke="#C9CED4" stroke-width="1.1"/><text x="612" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" 