<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Comparaison de INNER JOIN, LEFT JOIN et FULL JOIN</title><desc id="d">Trois clients (1, 2, 10) et quatre commandes (1, 2, 5, 14). Les clients 1 et 2 ont des commandes, le client 10 n’en a pas, la commande 14 appartient à un client absent de l’extrait. INNER JOIN garde 3 lignes, LEFT JOIN 4, FULL JOIN 5.</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#303030"/></marker><marker id="op" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#303030" stroke-width="1.6"/></marker></defs><rect width="1280" height="720" fill="#F7F7F7"/><rect x="24" y="20" width="1232" height="680" rx="22" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1.3"/><rect x="24" y="20" width="8" height="100" rx="4" fill="#F91562"/><text x="56" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303030" text-anchor="start">Les jointures : quelles lignes se rencontrent ?</text><text x="56" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555" text-anchor="start">Deux petites tables extraites de la librairie, et le résultat de chaque type de jointure.</text><line x1="56" y1="122" x2="1224" y2="122" stroke="#D9DEE3" stroke-width="1.4"/><text x="56" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">customers (extrait)</text><rect x="56" y="170" width="230" height="30" rx="0" fill="#303030" stroke="#303030" stroke-width="1.2"/><text x="64" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">customer_id</text><text x="174" y="190" font-family="Helvetica Neue,