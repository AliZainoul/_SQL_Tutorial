<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Ordre d’écriture et ordre logique d’exécution d’une requête SELECT</title><desc id="d">Ordre d’écriture : SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT. Ordre logique : FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT.</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#303030"/></marker><marker id="op" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#303030" stroke-width="1.6"/></marker></defs><rect width="1280" height="720" fill="#F7F7F7"/><rect x="24" y="20" width="1232" height="680" rx="22" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1.3"/><rect x="24" y="20" width="8" height="100" rx="4" fill="#F91562"/><text x="56" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303030" text-anchor="start">L’ordre logique d’exécution d’un SELECT</text><text x="56" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555" text-anchor="start">On l’écrit dans un ordre, le moteur le raisonne dans un autre.</text><line x1="56" y1="122" x2="1224" y2="122" stroke="#D9DEE3" stroke-width="1.4"/><text x="56" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#303030" text-anchor="start">Ce que vous écrivez</text><text x="560" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#303030" text-anchor="start">Ce que le moteur raisonne</text><rect x="56" y="190" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#303030" stroke-width="1.6"/><text x="76" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#303030" text-anchor="start">SELECT</text><circle cx="290" cy="213" r="14" fill="#F91562"/><text x="290" y="219" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="56" y="248" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#303030" stroke-width="1.6"/><text x="76" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#303030" text-anchor="start">FROM</text><circle cx="290" cy="271" r="14" fill="#F91562"/><text x="290" y="277" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="56" y="306" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#303030" stroke-width="1.6"/><text x="76" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#303030" text-anchor="start">WHERE</text><circle cx="290" cy="329" r="14" fill="#F91562"/><text x="290" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="56" y="364" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#303030" stroke-width="1.6"/><text x="76" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#303030" text-anchor="start">GROUP BY</text><circle cx="290" cy="387" r="14" fill="#F91562"/><text x="290" y="393" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="56" y="422" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#303030" stroke-width="1.6"/><text x="76" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#303030" text-anchor="start">HAVING</text><circle cx="290" cy="445" r="14" fill="#F91562"/><text x="290" y="451" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><rect x="56" y="480" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#303030" stroke-width="1.6"/><text x="76" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#303030" text-anchor="start">ORDER BY</text><circle cx="290" cy="503" r="14" fill="#F91562"/><text x="290" y="509" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><rect x="56" y="538" width="260" height="46" rx="8" fill="#FFFFFF" stroke="#303030" stroke-width="1.6"/><text x="76" y="568" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#303030" text-anchor="start">LIMIT</text><circle cx="290" cy="561" r="14" fill="#F91562"/><text x="290" y="567" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><rect x="560" y="190" width="330" height="46" rx="8" fill="#F7F7F7" stroke="#C9CED4" stroke-width="1.4"/><text x="578" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">1  FROM / JOIN</text><text x="578" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">assemble les tables</text><rect x="560" y="248" width="330" height="46" rx="8" fill="#F7F7F7" stroke="#C9CED4" stroke-width="1.4"/><text x="578" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">2  WHERE</text><text x="578" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">retire des lignes</text><line x1="725" y1="236" x2="725" y2="248" stroke="#303030" stroke-width="1.4" marker-end="url(#ar)"/><rect x="560" y="306" width="330" height="46" rx="8" fill="#F7F7F7" stroke="#C9CED4" stroke-width="1.4"/><text x="578" y="326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">3  GROUP BY</text><text x="578" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">forme les groupes</text><line x1="725" y1="294" x2="725" y2="306" stroke="#303030" stroke-width="1.4" marker-end="url(#ar)"/><rect x="560" y="364" width="330" height="46" rx="8" fill="#F7F7F7" stroke="#C9CED4" stroke-width="1.4"/><text x="578" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">4  HAVING</text><text x="578" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">retire des groupes</text><line x1="725" y1="352" x2="725" y2="364" stroke="#303030" stroke-width="1.4" marker-end="url(#ar)"/><rect x="560" y="422" width="330" height="46" rx="8" fill="#F7F7F7" stroke="#C9CED4" stroke-width="1.4"/><text x="578" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">5  SELECT</text><text x="578" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">calcule colonnes et alias</text><line x1="725" y1="410" x2="725" y2="422" stroke="#303030" stroke-width="1.4" marker-end="url(#ar)"/><rect x="560" y="480" width="330" height="46" rx="8" fill="#F7F7F7" stroke="#C9CED4" stroke-width="1.4"/><text x="578" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">6  ORDER BY</text><text x="578" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">trie le résultat</text><line x1="725" y1="468" x2="725" y2="480" stroke="#303030" stroke-width="1.4" marker-end="url(#ar)"/><rect x="560" y="538" width="330" height="46" rx="8" fill="#F7F7F7" stroke="#C9CED4" stroke-width="1.4"/><text x="578" y="558" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">7  LIMIT</text><text x="578" y="576" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">garde les premières lignes</text><line x1="725" y1="526" x2="725" y2="538" stroke="#303030" stroke-width="1.4" marker-end="url(#ar)"/><rect x="930" y="250" width="290" height="150" rx="10" fill="#FFFFFF" stroke="#F91562" stroke-width="2"/><text x="944" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">Conséquence :</text><text x="944" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="start">un alias défini dans SELECT</text><text x="944" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="start">n’existe pas encore dans WHERE,</text><text x="944" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="start">mais existe dans ORDER BY.</text><text x="56" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">Moyen mnémotechnique : « Faire Where Gentiment, Honorer Sélectionner, Ordonner, Limiter ».</text></svg>