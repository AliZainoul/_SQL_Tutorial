<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Différence entre une vue et une table physique</title><desc id="d">Les tables customers, orders et order_items contiennent les données. La vue v_customer_totals ne contient que la requête ; à chaque SELECT sur la vue, la requête est exécutée sur les tables.</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#303030"/></marker><marker id="op" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#303030" stroke-width="1.6"/></marker></defs><rect width="1280" height="720" fill="#F7F7F7"/><rect x="24" y="20" width="1232" height="680" rx="22" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1.3"/><rect x="24" y="20" width="8" height="100" rx="4" fill="#F91562"/><text x="56" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303030" text-anchor="start">Une vue ne stocke pas les données</text><text x="56" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555" text-anchor="start">Elle mémorise une requête, relancée à chaque utilisation sur les données actuelles.</text><line x1="56" y1="122" x2="1224" y2="122" stroke="#D9DEE3" stroke-width="1.4"/><rect x="56" y="170" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="156" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#303030" text-anchor="middle">customers</text><text x="156" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">données stockées</text><rect x="56" y="270" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="156" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#303030" text-anchor="middle">orders</text><text x="156" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">données stockées</text><rect x="56" y="370" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="156" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#303030" text-anchor="middle">order_items</text><text x="156" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">données stockées</text><rect x="380" y="230" width="330" height="130" rx="12" fill="#F7F7F7" stroke="#F91562" stroke-width="2.4"/><text x="545" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#303030" text-anchor="middle">Vue v_customer_totals</text><text x="545" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">contient seulement la requête :</text><text x="545" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="middle">SELECT … JOIN … GROUP BY …</text><text x="545" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">(aucune ligne copiée)</text><line x1="258" y1="205" x2="378" y2="270" stroke="#303030" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ar)"/><line x1="258" y1="305" x2="378" y2="285" stroke="#303030" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ar)"/><line x1="258" y1="405" x2="378" y2="300" stroke="#303030" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ar)"/><line x1="712" y1="295" x2="800" y2="295" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><rect x="802" y="250" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#303030" stroke-width="1.8"/><text x="922" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="middle">SELECT * FROM</text><text x="922" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="middle">v_customer_totals</text><text x="56" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">Chaque lecture de la vue relance la requête : si une commande est ajoutée, la vue la voit immédiatement.</text><text x="56" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#555555" text-anchor="start">À l’inverse, CREATE TABLE … AS SELECT ou une table temporaire copie les lignes à un instant donné : c’est un instantané qui vieillit.</text><text x="56" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#555555" text-anchor="start">Intérêt d’une vue : réutiliser une requête complexe sous un nom simple, et n’exposer que certaines colonnes.</text></svg>