<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Regroupement des lignes de commande par order_id</title><desc id="d">Sept lignes de commande des commandes 1, 2 et 3 sont regroupées par order_id ; la somme de quantité × prix donne 27,70 ; 40,40 et 25,30.</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#303030"/></marker><marker id="op" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#303030" stroke-width="1.6"/></marker></defs><rect width="1280" height="720" fill="#F7F7F7"/><rect x="24" y="20" width="1232" height="680" rx="22" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1.3"/><rect x="24" y="20" width="8" height="100" rx="4" fill="#F91562"/><text x="56" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303030" text-anchor="start">GROUP BY : du détail à la synthèse</text><text x="56" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555" text-anchor="start">Chaque groupe de lignes devient une seule ligne de résultat.</text><line x1="56" y1="122" x2="1224" y2="122" stroke="#D9DEE3" stroke-width="1.4"/><text x="56" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">order_items (extrait)</text><rect x="56" y="190" width="370" height="36" rx="0" fill="#303030" stroke="#303030" stroke-width="1.2"/><text x="64" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">order_id</text><text x="154" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">book_id</text><text x="244" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">quantity</text><text x="334" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">unit_price</text><rect x="56" y="226" width="370" height="36" rx="0" fill="#FDE8EF" stroke="#C9CED4" stroke-width="1.1"/><text x="64" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="154" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="244" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="334" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">11.90</text><rect x="56" y="262" width="370" height="36" rx="0" fill="#FDE8EF" stroke="#C9CED4" stroke-width="1.1"/><text x="64" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="154" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">4</text><text x="244" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">2</text><text x="334" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">7.90</text><rect x="56" y="298" width="370" height="36" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.1"/><text x="64" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">2</text><text x="154" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">7</text><text x="244" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="334" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">10.50</text><rect x="56" y="334" width="370" height="36" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.1"/><text x="64" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">2</text><text x="154" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">14</text><text x="244" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="334" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">29.90</text><rect x="56" y="370" width="370" height="36" rx="0" fill="#FDE8EF" stroke="#C9CED4" stroke-width="1.1"/><text x="64" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">3</text><text x="154" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">2</text><text x="244" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="334" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">9.50</text><rect x="56" y="406" width="370" height="36" rx="0" fill="#FDE8EF" stroke="#C9CED4" stroke-width="1.1"/><text x="64" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">3</text><text x="154" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">3</text><text x="244" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="334" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">8.90</text><rect x="56" y="442" width="370" height="36" rx="0" fill="#FDE8EF" stroke="#C9CED4" stroke-width="1.1"/><text x="64" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">3</text><text x="154" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">5</text><text x="244" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="334" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">6.90</text><rect x="40" y="226" width="8" height="72" rx="3" fill="#F91562" stroke="#F91562" stroke-width="1"/><rect x="40" y="298" width="8" height="72" rx="3" fill="#303030" stroke="#303030" stroke-width="1"/><rect x="40" y="370" width="8" height="108" rx="3" fill="#555555" stroke="#555555" stroke-width="1"/><line x1="444" y1="262" x2="620" y2="262" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><line x1="444" y1="334" x2="620" y2="334" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><line x1="444" y1="424" x2="620" y2="424" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><text x="630" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F91562" text-anchor="start">GROUP BY order_id</text><rect x="630" y="190" width="210" height="36" rx="0" fill="#303030" stroke="#303030" stroke-width="1.2"/><text x="638" y="213" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">order_id</text><text x="740" y="213" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">total</text><rect x="630" y="226" width="210" height="72" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.1"/><text x="638" y="267.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">1</text><text x="740" y="267.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">27.70</text><rect x="630" y="298" width="210" height="72" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.1"/><text x="638" y="339.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">2</text><text x="740" y="339.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">40.40</text><rect x="630" y="370" width="210" height="108" rx="0" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1.1"/><text x="638" y="429.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">3</text><text x="740" y="429.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#303030" text-anchor="start">25.30</text><text x="630" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="start">total = SUM(quantity * unit_price) ; COUNT(*) donnerait 2, 2 et 3 lignes.</text><text x="56" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">Sans GROUP BY, une fonction d’agrégation (SUM, COUNT…) condense TOUTE la table en une seule ligne.</text><text x="56" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#555555" text-anchor="start">Avec GROUP BY, elle condense chaque groupe séparément. Toute colonne du SELECT doit être soit dans GROUP BY, soit agrégée.</text><text x="56" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#555555" text-anchor="start">WHERE filtre les lignes AVANT le regroupement ; HAVING filtre les groupes APRÈS.</text></svg>