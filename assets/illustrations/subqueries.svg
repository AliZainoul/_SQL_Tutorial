<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Comparaison entre une sous-requête imbriquée et une sous-requête corrélée</title><desc id="d">La sous-requête imbriquée s’exécute une fois et son résultat sert à la requête externe. La sous-requête corrélée s’exécute pour chaque ligne de la requête externe, car elle utilise une valeur de cette ligne.</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#303030"/></marker><marker id="op" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#303030" stroke-width="1.6"/></marker></defs><rect width="1280" height="720" fill="#F7F7F7"/><rect x="24" y="20" width="1232" height="680" rx="22" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1.3"/><rect x="24" y="20" width="8" height="100" rx="4" fill="#F91562"/><text x="56" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303030" text-anchor="start">Sous-requête imbriquée et sous-requête corrélée</text><text x="56" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555" text-anchor="start">Une requête à l’intérieur d’une autre : combien de fois s’exécute-t-elle ?</text><line x1="56" y1="122" x2="1224" y2="122" stroke="#D9DEE3" stroke-width="1.4"/><text x="56" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#303030" text-anchor="start">Imbriquée : indépendante</text><text x="670" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#303030" text-anchor="start">Corrélée : dépend de la ligne courante</text><rect x="56" y="190" width="520" height="70" rx="10" fill="#FFFFFF" stroke="#303030" stroke-width="1.6"/><text x="72" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="start">SELECT title FROM books WHERE unit_price &gt;</text><rect x="72" y="228" width="488" height="24" rx="6" fill="#FDE8EF" stroke="#F91562" stroke-width="1.4"/><text x="80" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">(SELECT AVG(unit_price) FROM books)</text><text x="56" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">1. La sous-requête s’exécute UNE fois : elle donne 12,52</text><text x="56" y="326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">2. Le moteur compare ensuite chaque livre à cette valeur.</text><line x1="316" y1="262" x2="316" y2="372" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><rect x="166" y="376" width="300" height="52" rx="10" fill="#F7F7F7" stroke="#C9CED4" stroke-width="1.4"/><text x="316" y="408" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="middle">Résultat : livres plus chers que la moyenne</text><rect x="670" y="190" width="550" height="96" rx="10" fill="#FFFFFF" stroke="#303030" stroke-width="1.6"/><text x="686" y="216" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="start">SELECT c.first_name FROM customers c WHERE EXISTS</text><rect x="686" y="226" width="518" height="48" rx="6" fill="#FDE8EF" stroke="#F91562" stroke-width="1.4"/><text x="694" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">(SELECT 1 FROM orders o</text><text x="694" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start"> WHERE o.customer_id = c.customer_id)</text><text x="670" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#303030" text-anchor="start">Pour CHAQUE client c de la requête externe :</text><rect x="670" y="340" width="200" height="38" rx="8" fill="#F7F7F7" stroke="#C9CED4" stroke-width="1.2"/><text x="684" y="365" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">Camille (1)</text><line x1="872" y1="359" x2="920" y2="359" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><text x="930" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="start">a au moins une commande → gardée</text><rect x="670" y="390" width="200" height="38" rx="8" fill="#F7F7F7" stroke="#C9CED4" stroke-width="1.2"/><text x="684" y="415" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">Lucas (2)</text><line x1="872" y1="409" x2="920" y2="409" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><text x="930" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="start">a au moins une commande → gardé</text><rect x="670" y="440" width="200" height="38" rx="8" fill="#F7F7F7" stroke="#C9CED4" stroke-width="1.2"/><text x="684" y="465" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#303030" text-anchor="start">Jules (10)</text><line x1="872" y1="459" x2="920" y2="459" stroke="#303030" stroke-width="1.8" marker-end="url(#ar)"/><text x="930" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#303030" text-anchor="start">aucune commande → écarté</text><text x="56" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#303030" text-anchor="start">Le mot « corrélée » vient de la référence c.customer_id, empruntée à la requête externe : la sous-requête ne peut pas s’exécuter seule.</text><text x="56" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#555555" text-anchor="start">Les moteurs optimisent souvent les deux formes ; raisonnez comme si la corrélée s’exécutait ligne par ligne, c’est le modèle mental correct.</text></svg>